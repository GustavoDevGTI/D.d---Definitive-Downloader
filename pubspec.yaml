name: definitive_downloader
description: Aplicativo desktop e mobile para organizar, transferir e baixar coleções musicais.
publish_to: none
version: 0.1.57+58
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.4
  html: ^0.15.6
  path: ^1.9.1
  path_provider: ^2.1.5
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: 0.5.42
  url_launcher: ^6.3.2
  crypto: ^3.0.8
  flutter_secure_storage: ^11.2.0
  flutter_inappwebview: 6.2.0-beta.3
  ffi: ^2.2.0
  media_kit: 1.2.6
  media_kit_libs_audio: 1.0.7
  desktop_drop: 0.8.1
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo/
    - assets/brand/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
